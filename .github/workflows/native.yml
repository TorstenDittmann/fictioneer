name: "native"

on:
    push:
        branches: [main]
        paths:
            - "apps/fictioneer-swift/**"
            - ".github/workflows/native.yml"
    pull_request:
        branches: [main]
        paths:
            - "apps/fictioneer-swift/**"
            - ".github/workflows/native.yml"

concurrency:
    group: native-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        # Swift 6.2 build settings (default MainActor isolation, approachable
        # concurrency) need Xcode 26.
        runs-on: macos-26
        timeout-minutes: 30
        defaults:
            run:
                working-directory: apps/fictioneer-swift

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Select Xcode
              uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable

            - name: Install XcodeGen
              run: brew install xcodegen

            - name: Generate project
              run: xcodegen

            - name: Cache Swift packages
              uses: actions/cache@v4
              with:
                  path: apps/fictioneer-swift/build/SourcePackages
                  key: spm-${{ runner.os }}-${{ hashFiles('apps/fictioneer-swift/project.yml') }}

            # Default builds are ad-hoc signed without iCloud, so no
            # certificates are needed here.
            - name: Run tests
              run: |
                  xcodebuild test \
                    -scheme Fictioneer \
                    -derivedDataPath build \
                    -destination 'platform=macOS' \
                    -resultBundlePath TestResults.xcresult \
                    -quiet

            - name: Upload test results
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: TestResults
                  path: apps/fictioneer-swift/TestResults.xcresult
